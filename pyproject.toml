[project]
name = "lec-ai-router"
version = "2.0.0"
description = "Concurrency-safe async LLM inference routing gateway"
readme = "README.md"
authors = [
    { name = "Akhileshwar Sanathana", email = "akhileshwar008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-json-logger>=4.1.0",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]
